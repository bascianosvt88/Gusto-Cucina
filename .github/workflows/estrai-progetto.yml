
name: Estrai progetto Gusto Cucina

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Estrai progetto Android
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP del progetto non trovato"
            exit 1
          fi

          mkdir -p /tmp/gusto
          unzip -q "$ZIP" -d /tmp/gusto

          PROJECT=$(find /tmp/gusto -name settings.gradle -type f -print -quit)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find /tmp/gusto -name settings.gradle.kts -type f -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "File settings.gradle non trovato"
            exit 1
          fi

          cp -R "$(dirname "$PROJECT")"/. .

      - name: Salva i file estratti
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Estrai progetto Gusto Cucina [skip ci]" || {
            echo "Nessuna modifica da salvare"
            exit 0
          }

          git push origin HEAD:main
